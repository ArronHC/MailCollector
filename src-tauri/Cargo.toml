[package]
name = "mail-collector"
version = "0.10.0"
description = "A local-first desktop mail collector"
authors = ["OpenSpace"]
edition = "2021"

[lib]
name = "mail_collector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rand = "0.8"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
