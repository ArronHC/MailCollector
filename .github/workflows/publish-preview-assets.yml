name: Publish Verified Preview Assets

on:
  push:
    branches:
      - feature/device-pairing-sync-v2
    paths:
      - ".github/workflows/publish-preview-assets.yml"

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: v0.10.1-vps-relay-preview.1
  WINDOWS_RUN_ID: "32469936071"
  ANDROID_RUN_ID: "32469936070"

jobs:
  publish:
    name: Publish verified Windows and Android packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Windows preview artifact
        uses: actions/download-artifact@v4
        with:
          name: mail-collector-windows-preview
          path: incoming/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.WINDOWS_RUN_ID }}

      - name: Download verified Android artifact
        uses: actions/download-artifact@v4
        with:
          name: mail-collector-debug-apk
          path: incoming/android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.ANDROID_RUN_ID }}

      - name: Stage release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          WINDOWS_SOURCE="$(find incoming/windows -type f -name '*.exe' | head -n 1)"
          ANDROID_SOURCE="$(find incoming/android -type f -name '*.apk' | head -n 1)"
          test -n "$WINDOWS_SOURCE"
          test -n "$ANDROID_SOURCE"

          WINDOWS_NAME="MailCollector-Windows-${RELEASE_TAG}-x64-setup.exe"
          ANDROID_NAME="MailCollector-Android-${RELEASE_TAG}-debug.apk"
          cp "$WINDOWS_SOURCE" "release-assets/${WINDOWS_NAME}"
          cp "$ANDROID_SOURCE" "release-assets/${ANDROID_NAME}"

          cd release-assets
          sha256sum "$WINDOWS_NAME" > "${WINDOWS_NAME}.sha256"
          sha256sum "$ANDROID_NAME" > "${ANDROID_NAME}.sha256"
          ls -lah

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Mail Collector v0.10.1 VPS Relay Preview 1
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            VPS Relay + Android pairing preview.

            Packages in this Release come from previously verified GitHub Actions runs:
            - Windows Preview #3 (run 32469936071)
            - Android APK #25 (run 32469936070)

            Included:
            - Windows x64 NSIS installer with bundled frpc v0.70.1
            - Android debug APK
            - SHA-256 checksum files for both packages
            - Managed Windows VPS Relay configuration
            - Six-digit Android device pairing with independent Device Token

            See the repository README for complete Windows, VPS and Android instructions.

            Notes:
            - Windows preview installer is unsigned and may trigger SmartScreen.
            - Android package is a debug APK intended for preview testing.
            - VPS is transport-only; Windows Mail Collector must stay online for Android access.
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Record successful publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/release-status.md <<EOF
          # Preview release status

          - Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          - Tag: ${RELEASE_TAG}
          - Source Windows workflow run: ${WINDOWS_RUN_ID}
          - Source Android workflow run: ${ANDROID_RUN_ID}
          - Windows asset: MailCollector-Windows-${RELEASE_TAG}-x64-setup.exe
          - Android asset: MailCollector-Android-${RELEASE_TAG}-debug.apk
          - Status: published successfully
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status.md
          git commit -m "chore: record ${RELEASE_TAG} publication"
          git push origin HEAD:feature/device-pairing-sync-v2
