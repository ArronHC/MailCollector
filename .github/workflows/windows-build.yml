name: Client Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "frontend/**"
      - "capacitor.config.ts"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write
  statuses: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows client
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_TIMESTAMP_TSP: ${{ vars.WINDOWS_TIMESTAMP_TSP }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prepare Windows Authenticode signing
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: ./scripts/prepare-windows-signing.ps1
      - name: Build signed Windows installer
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: npx tauri build --bundles nsis --config src-tauri/tauri.signing.conf.json
      - name: Verify Windows Authenticode signatures
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
      - name: Build unsigned Windows installer
        if: env.WINDOWS_SIGNING_MODE == '' || env.WINDOWS_SIGNING_MODE == 'none'
        shell: pwsh
        run: |
          Write-Warning "Building an unsigned Windows client release. Windows/SmartScreen may display publisher or reputation warnings."
          npx tauri build --bundles nsis
      - name: Stage Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $name = "MailCollector-Windows-$('${{ steps.version.outputs.tag }}')-x64-setup.exe"
          $target = Join-Path $PWD "release-assets/$name"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $target
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$target.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Build Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build:web
      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android || true
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Stage Android APK
        shell: bash
        run: |
          mkdir -p release-assets
          name="MailCollector-Android-${{ steps.version.outputs.tag }}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/${name}"
          cd release-assets
          sha256sum "$name" > "${name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish Windows and Android packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mail Collector ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true

  report:
    name: Report client release status
    if: ${{ always() }}
    needs: [windows, android, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Report client release status
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              windows: '${{ needs.windows.result }}',
              android: '${{ needs.android.result }}',
              publish: '${{ needs.publish.result }}'
            };
            const ok = Object.values(results).every((result) => result === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'release/client',
              description: ok ? 'Windows + Android release published' : `windows=${results.windows}, android=${results.android}, publish=${results.publish}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
            if (!ok) core.setFailed('Client release failed');
