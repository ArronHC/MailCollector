name: Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "src-tauri/tauri.conf.json"
      - "src-tauri/Cargo.toml"
      - "frontend/**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_TIMESTAMP_TSP: ${{ vars.WINDOWS_TIMESTAMP_TSP }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release readiness
        shell: pwsh
        run: ./scripts/check-release-readiness.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Prepare Windows Authenticode signing
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: ./scripts/prepare-windows-signing.ps1
      - name: Build signed Windows installer
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: npx tauri build --bundles nsis --config src-tauri/tauri.signing.conf.json
      - name: Verify Windows Authenticode signatures
        if: env.WINDOWS_SIGNING_MODE != '' && env.WINDOWS_SIGNING_MODE != 'none'
        shell: pwsh
        run: ./scripts/verify-windows-signing.ps1
      - name: Build unsigned Windows installer
        if: env.WINDOWS_SIGNING_MODE == '' || env.WINDOWS_SIGNING_MODE == 'none'
        shell: pwsh
        run: |
          Write-Warning "Building an unsigned Windows client release. Windows/SmartScreen may display publisher or reputation warnings."
          npx tauri build --bundles nsis
      - name: Generate installer SHA-256 checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mail-collector-windows-${{ steps.version.outputs.tag }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mail Collector ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256
          fail_on_unmatched_files: true
