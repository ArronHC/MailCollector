name: VPS Relay Preview Release

on:
  push:
    branches:
      - feature/device-pairing-sync-v2
    paths:
      - ".github/workflows/preview-release.yml"

permissions:
  contents: write

env:
  RELEASE_TAG: v0.10.1-vps-relay-preview.1

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    env:
      npm_config_msvs_version: "2022"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build unsigned Windows installer
        run: npx tauri build --bundles nsis
      - name: Verify and stage Windows installer
        shell: pwsh
        run: |
          $frpc = Join-Path $PWD "src-tauri/resources/runtime/frpc.exe"
          if (-not (Test-Path $frpc)) {
            throw "Release runtime is missing frpc.exe"
          }
          $frpVersion = (& $frpc --version).Trim()
          if ($frpVersion -notin @("0.70.1", "v0.70.1")) {
            throw "Unexpected frpc version: $frpVersion"
          }

          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $name = "MailCollector-Windows-$env:RELEASE_TAG-x64-setup.exe"
          $target = Join-Path $PWD "release-assets/$name"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $target
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -Encoding ascii "$target.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release-windows
          path: release-assets/*
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build:web
      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android || true
      - name: Sync Android project
        run: npx cap sync android
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          NAME="MailCollector-Android-${RELEASE_TAG}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/${NAME}"
          cd release-assets
          sha256sum "${NAME}" > "${NAME}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-release-android
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-release-*
          path: release-assets
          merge-multiple: true
      - name: List release assets
        run: ls -lah release-assets
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Mail Collector v0.10.1 VPS Relay Preview 1
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            VPS Relay + Android pairing preview.

            Included:
            - Windows x64 NSIS installer with bundled and SHA-256 verified frpc v0.70.1
            - Android debug APK
            - SHA-256 checksum files for both packages
            - Managed Windows VPS Relay configuration and health test
            - Six-digit Android device pairing with independent Device Token

            Deployment and usage instructions are in the repository README.

            Notes:
            - The Windows preview installer is unsigned and may trigger SmartScreen.
            - The Android package is a debug APK intended for preview testing.
            - The VPS is transport-only; the Windows Mail Collector host must remain online for Android access.
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Record successful publication
        shell: bash
        run: |
          mkdir -p .github
          cat > .github/release-status.md <<EOF
          # Preview release status

          - Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}
          - Tag: ${RELEASE_TAG}
          - Source commit: ${GITHUB_SHA}
          - Windows asset: MailCollector-Windows-${RELEASE_TAG}-x64-setup.exe
          - Android asset: MailCollector-Android-${RELEASE_TAG}-debug.apk
          - Status: published successfully
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-status.md
          git commit -m "chore: record ${RELEASE_TAG} publication"
          git push origin HEAD:feature/device-pairing-sync-v2
