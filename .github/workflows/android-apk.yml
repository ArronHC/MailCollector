name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [feature/mobile-experience]
  pull_request:
    paths:
      - 'frontend/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build:web
      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android || true
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mail-collector-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
