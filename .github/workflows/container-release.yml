name: Container Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "src/**"
      - "frontend/**"
      - "migrations/**"
      - "scripts/finalize-server-entry.mjs"
      - "tsconfig.json"
      - ".github/workflows/container-release.yml"

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/arronhc/mailcollector:${{ steps.version.outputs.version }}
            ghcr.io/arronhc/mailcollector:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  report:
    name: Report container release status
    if: ${{ always() }}
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Report container release status
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ needs.publish.result }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'release/container',
              description: ok ? 'GHCR image published' : 'GHCR publish failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
            if (!ok) core.setFailed('Container release failed');
